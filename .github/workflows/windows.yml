name: Windows Meson tests

on:
  push:
    branches:
      - main
      - maintenance/**
  pull_request:
    branches:
      - main
      - maintenance/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Meson Windows tests
    # Ensure (a) this doesn't run on forks by default, and
    #        (b) it does run with Act locally (`github` doesn't exist there)
    # if: "github.repository != '' || github.repository == 'scipy/scipy'"
    runs-on: windows-2019
    strategy:
      matrix:
        python-version: [3.9, pypy-3.9-nightly]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'environment.yml'
      - name: install-rtools
        run: |
          choco install rtools --no-progress
          echo "c:\rtools40\ucrt64\bin;" >> $env:GITHUB_PATH
      - name: show-gfortran
        run: |
          gcc --version
          gfortran --version
      - name: update timestamps
        # A nightly may have a timestamp in the "future" (local time on the build machine)
        # This will trip up meson since it checks the python timestamps
        shell: pwsh
        run: |
          $PYDIR=$(python -c"import sys; print(sys.exec_prefix)")
          Get-ChildItem -force -recurse $PYDIR * | ForEach-Object{$_.CreationTime = ("3 May 2012 17:00:00")}
          Get-ChildItem -force -recurse $PYDIR * | ForEach-Object{$_.LastAccessTime = ("3 May 2012 17:00:00")}
          Get-ChildItem -force -recurse $PYDIR * | ForEach-Object{$_.LastWriteTime = ("3 May 2012 17:00:00")}
        if: ${{ matrix.python-version == 'pypy-3.9-nightly' }}

      - name: pip-packages
        run: |
          python -m pip install numpy==1.23.0 cython pybind11 pythran meson ninja pytest pytest-xdist pytest-timeout
          python -m pip install git+https://github.com/cython/cython.git@0.29.x

      - name: openblas-libs
        run: |
          # Download and install pre-built OpenBLAS library
          # Built with mingw-w64, -ucrt -static.
          # https://github.com/matthew-brett/openblas-libs/blob/ucrt-build/build_openblas.ps1
          choco install unzip -y
          choco install wget -y
          wget https://github.com/scipy/scipy-ci-artifacts/raw/main/openblas_32_if.zip
          unzip -d c:\ openblas_32_if.zip
          echo "PKG_CONFIG_PATH=c:\opt\openblas\if_32\64\lib\pkgconfig;" >> $env:GITHUB_ENV
      - name: meson-configure
        run: |
          meson build --prefix=$PWD\build
      - name: meson-build
        run: |
          ninja -v -j 2 -C build
      - name: meson-install
        run: |
          cd build
          meson install
      - name: build-path
        run: |
          echo "installed_path=$PWD\build\Lib\site-packages" >> $env:GITHUB_ENV
      - name: post-install
        run: |
          $scipy_path = "${env:installed_path}\scipy"
          $libs_path = "${scipy_path}\.libs"
          mkdir ${libs_path}
          $ob_path = (pkg-config --variable libdir openblas) -replace "lib", "bin"
          cp $ob_path/*.dll $libs_path
          # Write _distributor_init.py to scipy dir to load .libs DLLs.
          & python tools\openblas_support.py --write-init $scipy_path
      - name: prep-test
        run: |
          echo "PYTHONPATH=${env:installed_path}" >> $env:GITHUB_ENV
          echo "SCIPY_USE_PROPACK=1" >> $env:GITHUB_ENV
      - name: test
        run: |
          mkdir tmp
          cd tmp
          python -c 'import scipy; scipy.test(verbose=1)'
